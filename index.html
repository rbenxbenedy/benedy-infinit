<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>BENEDY INFINIT LUXE | O CÉU É O LIMITE</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
a{text-decoration:none;color:inherit}
header{background:#000;color:#fff;padding:22px 15px;text-align:center}
.logo{font-family:Georgia,serif;font-size:29px;font-weight:bold;letter-spacing:2px}
.logo span{font-size:34px}
.slogan{font-size:12px;letter-spacing:4px;margin-top:8px}
nav{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:22px}
nav a{font-size:12px;font-weight:bold}
.hero{background:#000;color:#fff;text-align:center;padding:65px 20px}
.hero h1{font-size:clamp(32px,7vw,60px);margin:0 0 15px;letter-spacing:2px}
.hero p{font-size:14px;line-height:1.8;max-width:550px;margin:0 auto 25px}
.btn{display:inline-block;background:#fff;color:#000;padding:13px 22px;border-radius:3px;font-weight:bold;font-size:12px}
.section{padding:45px 15px;max-width:1200px;margin:auto}
.section-title{text-align:center;font-family:Georgia,serif;font-size:28px;letter-spacing:2px}
.section-desc{text-align:center;color:#666;font-size:13px;margin-bottom:30px}
.collections{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.collection{background:#000;color:#fff;padding:30px 20px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.collection h3{letter-spacing:2px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{border:1px solid #e5e5e5;background:#fff;padding:10px;display:flex;flex-direction:column}
.card img{width:100%;height:270px;object-fit:cover;background:#f4f4f4}
.card h3{font-size:15px;margin:15px 0 8px}
.price{font-size:13px;font-weight:bold}
.details{font-size:12px;color:#555;line-height:1.8}
.order{display:block;text-align:center;background:#000;color:#fff;padding:13px;margin-top:auto;font-size:12px;font-weight:bold}
.order:hover{background:#333}
.features{background:#000;color:#fff;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;padding:30px 15px;text-align:center;font-size:12px}
footer{background:#000;color:#fff;text-align:center;padding:30px 15px;font-size:12px;line-height:2}
footer a{color:#fff;text-decoration:underline}
.whatsapp{position:fixed;right:16px;bottom:18px;background:#000;color:#fff;border:2px solid #fff;border-radius:30px;padding:14px 18px;font-weight:bold;font-size:12px;box-shadow:0 2px 10px #777;z-index:10}
@media(max-width:480px){.hero{padding:48px 15px}.card img{height:250px}.section{padding:32px 12px}nav{gap:13px}}
</style>
</head>

<body>

<header>
  <div class="logo">B<span>∞</span> BENEDY</div>
  <div class="slogan">INFINIT LUXE · O CÉU É O LIMITE.</div>
  <nav>

    <a href="#colecoes">COLEÇÕES</a>
    <a href="#produtos">PRODUTOS</a>
    <a href="#contactos">CONTACTOS</a>
  </nav>
</header>

<section class="hero" id="inicio">
