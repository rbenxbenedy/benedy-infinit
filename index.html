<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BENEDY INFINIT LUXE</title>

<meta name="description"
content="BENEDY INFINIT LUXE — Moda premium. SKY'S THE LIMIT.">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --preto: #050505;
  --branco: #ffffff;
  --cinza: #b8b8b8;
  --cinza-escuro: #171717;
  --borda: #303030;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--preto);
  color: var(--branco);
  line-height: 1.6;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}

.container {
  width: 90%;
  max-width: 1200px;
  margin: auto;
}

.section-title {
  text-align: center;
  font-size: 30px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 15px;
}

.section-description {
  text-align: center;
  color: var(--cinza);
  max-width: 650px;
  margin: 0 auto 40px;
}
/* CABEÇALHO */
header {
  width: 100%;
  background: #050505;
  border-bottom: 1px solid #303030;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-content {
  min-height: 85px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-symbol {
  font-size: 38px;
  font-weight: bold;
  color: #ffffff;
}

.logo-text {
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 2px;
}

.logo-slogan {
  font-size: 10px;
  letter-spacing: 3px;
  color: #b8b8b8;
}

nav {
  display: flex;
  align-items: center;
  gap: 25px;
}

nav a {
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.3s;
}

nav a:hover {
  color: #aaaaaa;
}

.menu-toggle {
  display: none;
  background: transparent;
  border: 1px solid #ffffff;
  color: #ffffff;
  padding: 8px 12px;
  font-size: 20px;
}
/* BANNER PRINCIPAL */
.hero {
  min-height: 580px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 80px 20px;
  background:
    radial-gradient(
      ellipse at center,
      #252525 0%,
      #101010 45%,
      #050505 100%
    );
  border-bottom: 1px solid #303030;
}

.hero-content {
  max-width: 850px;
}

.hero-label {
  font-size: 11px;
  letter-spacing: 5px;
  color: #b8b8b8;
  text-transform: uppercase;
  margin-bottom: 25px;
}

.hero h1 {
  font-size: clamp(35px, 7vw, 76px);
  line-height: 1.15;
  letter-spacing: 5px;
  font-weight: 800;
  margin-bottom: 20px;
}

.hero h1 span {
  display: block;
  color: #b8b8b8;
}

.hero p {
  max-width: 600px;
  margin: 0 auto 30px;
  color: #dddddd;
  font-size: 15px;
  letter-spacing: 1px;
}

.hero-slogan {
  font-size: 14px;
  letter-spacing: 6px;
  font-weight: bold;
  margin-bottom: 35px;
}

.button {
  display: inline-block;
  padding: 15px 28px;
  background: #ffffff;
  color: #050505;
  border: 1px solid #ffffff;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: 0.3s;
}

.button:hover {
  background: #050505;
  color: #ffffff;
}

.button-outline {
  display: inline-block;
  padding: 14px 27px;
  border: 1px solid #ffffff;
  color: #ffffff;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-left: 10px;
  transition: 0.3s;
}

.button-outline:hover {
  background: #ffffff;
  color: #050505;
  }
/* APRESENTAÇÃO DA MARCA */
.brand-intro {
  padding: 85px 20px;
  text-align: center;
  background: #0a0a0a;
}

.brand-monogram {
  font-size: 65px;
  font-weight: bold;
  letter-spacing: -5px;
  margin-bottom: 20px;
}

.brand-intro h2 {
  font-size: 25px;
  letter-spacing: 4px;
  margin-bottom: 20px;
}

.brand-intro p {
  max-width: 750px;
  margin: 0 auto;
  color: #b8b8b8;
  font-size: 14px;
  line-height: 2;
}

.brand-values {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 35px;
  margin-top: 40px;
}

.brand-value {
  min-width: 130px;
  padding: 15px;
  border-top: 1px solid #555555;
}

.brand-value strong {
  display: block;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

.brand-value span {
  font-size: 11px;
  color: #999999;
  }
/* SECÇÃO DE COLEÇÕES */
.collections {
  padding: 85px 0;
  background: #050505;
}

.collection-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 40px;
}

.collection-card {
  min-height: 280px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 30px;
  overflow: hidden;
  background: linear-gradient(145deg, #292929, #080808);
  border: 1px solid #303030;
  transition: transform 0.3s, border-color 0.3s;
}

.collection-card:hover {
  transform: translateY(-5px);
  border-color: #ffffff;
}

.collection-number {
  position: absolute;
  top: 20px;
  right: 22px;
  font-size: 45px;
  font-weight: bold;
  color: #292929;
}

.collection-card h3 {
  font-size: 20px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.collection-card p {
  color: #b8b8b8;
  font-size: 13px;
  margin-bottom: 20px;
}

.collection-link {
  display: inline-block;
  width: fit-content;
  font-size: 11px;
  letter-spacing: 2px;
  border-bottom: 1px solid #ffffff;
  padding-bottom: 5px;
  text-transform: uppercase;
  }
/* CATÁLOGO DE PRODUTOS */
.products {
  padding: 85px 0;
  background: #0a0a0a;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  margin-top: 40px;
}

.product-card {
  background: #111111;
  border: 1px solid #292929;
  overflow: hidden;
  transition: transform 0.3s, border-color 0.3s;
}

.product-card:hover {
  transform: translateY(-5px);
  border-color: #666666;
}

.product-image {
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #eeeeee;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s;
}

.product-card:hover .product-image img {
  transform: scale(1.04);
}

.product-info {
  padding: 22px;
}

.product-category {
  color: #999999;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.product-info h3 {
  font-size: 16px;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.product-price {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 12px;
}

.product-sizes {
  color: #aaaaaa;
  font-size: 12px;
  margin-bottom: 18px;
}

.product-button {
  display: block;
  width: 100%;
  padding: 13px 10px;
  background: #ffffff;
  color: #050505;
  border: 1px solid #ffffff;
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: 0.3s;
}

.product-button:hover {
  background: #050505;
  color: #ffffff;
  }
/* ETIQUETAS DOS PRODUTOS */
.product-badge {
  display: inline-block;
  padding: 6px 10px;
  border: 1px solid #555555;
  color: #ffffff;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.product-details {
  border-top: 1px solid #292929;
  margin-top: 15px;
  padding-top: 15px;
}

.product-details p {
  color: #aaaaaa;
  font-size: 12px;
  margin-bottom: 8px;
}

.product-details strong {
  color: #ffffff;
}

.catalog-note {
  text-align: center;
  color: #999999;
  font-size: 12px;
  margin-top: 35px;
  line-height: 1.8;
}

/* BOTÃO DE CONSULTA */
.consult-button {
  display: inline-block;
  padding: 13px 22px;
  background: #ffffff;
  color: #050505;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  text-align: center;
  text-transform: uppercase;
  transition: 0.3s;
}

.consult-button:hover {
  background: #cccccc;
}

.product-image img {
  background: #f5f5f5;
}

.product-image img[src=""] {
  display: none;
  }
/* SECÇÃO DE CONTACTO */
.contact {
  padding: 85px 20px;
  background: #050505;
  text-align: center;
  border-top: 1px solid #303030;
  border-bottom: 1px solid #303030;
}

.contact-content {
  max-width: 750px;
  margin: auto;
}

.contact h2 {
  font-size: 30px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.contact p {
  color: #b8b8b8;
  font-size: 14px;
  margin-bottom: 30px;
}

.whatsapp-button {
  display: inline-block;
  padding: 16px 28px;
  background: #ffffff;
  color: #050505;
  border: 1px solid #ffffff;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: 0.3s;
}

.whatsapp-button:hover {
  background: #050505;
  color: #ffffff;
}

.contact-number {
  margin-top: 20px;
  font-size: 13px;
  letter-spacing: 2px;
  color: #ffffff;
}

.contact-note {
  margin-top: 15px;
  color: #888888;
  font-size: 11px;
  }
/* RODAPÉ */
footer {
  padding: 45px 20px 25px;
  background: #080808;
  text-align: center;
}

.footer-logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

.footer-slogan {
  color: #aaaaaa;
  font-size: 11px;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

.footer-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 25px;
  margin-bottom: 25px;
}

.footer-links a {
  font-size: 11px;
  color: #cccccc;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.footer-links a:hover {
  color: #ffffff;
}

.footer-line {
  width: 100%;
  max-width: 500px;
  height: 1px;
  background: #303030;
  margin: 25px auto;
}

.copyright {
  color: #777777;
  font-size: 11px;
  line-height: 1.8;
}

.copyright strong {
  color: #ffffff;
}
/* ADAPTAÇÃO PARA TELEMÓVEIS */
@media (max-width: 900px) {
  .container {
    width: 92%;
  }

  .collection-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .product-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }

  .header-content {
    min-height: 75px;
  }

  nav {
    gap: 15px;
  }

  nav a {
    font-size: 10px;
  }
}

@media (max-width: 600px) {
  .header-content {
    flex-wrap: wrap;
    padding: 15px 0;
  }

  .logo-symbol {
    font-size: 30px;
  }

  .logo-text {
    font-size: 13px;
    letter-spacing: 1px;
  }

  .logo-slogan {
    font-size: 9px;
    letter-spacing: 2px;
  }

  nav {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  nav a {
    font-size: 10px;
  }

  .hero {
    min-height: 470px;
    padding: 60px 15px;
  }

  .hero h1 {
    font-size: 34px;
    letter-spacing: 2px;
  }

  .hero p {
    font-size: 13px;
  }

  .hero-slogan {
    font-size: 11px;
    letter-spacing: 4px;
  }

  .button,
  .button-outline {
    display: block;
    width: 100%;
    max-width: 280px;
    margin: 10px auto;
  }

  .section-title {
    font-size: 23px;
    letter-spacing: 2px;
  }

  .brand-intro,
  .collections,
  .products,
  .contact {
    padding-top: 60px;
    padding-bottom: 60px;
  }

  .collection-grid {
    grid-template-columns: 1fr;
  }

  .collection-card {
    min-height: 220px;
  }

  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .product-info {
    padding: 12px;
  }

  .product-info h3 {
    font-size: 13px;
  }

  .product-price {
    font-size: 12px;
  }

  .product-sizes {
    font-size: 11px;
  }

  .product-button {
    font-size: 9px;
    padding: 11px 5px;
  }

  .contact h2 {
    font-size: 24px;
  }

  .footer-links {
    gap: 15px;
  }
    }
